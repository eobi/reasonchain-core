[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasonchain"
version = "0.1.0"
description = "Closed-loop LLM architecture for autonomous multi-tool cybersecurity assessment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Obi Ebuka David", email = "davidobi023@gmail.com" },
  { name = "Sayed Erfan Arefin" },
]
keywords = [
  "llm", "agents", "cybersecurity", "penetration-testing",
  "autonomous-assessment", "tool-use",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # Minimal core: pin lightly here, lock in requirements.txt for reproducibility
  "pydantic>=2.0",
]

[project.optional-dependencies]
experiments = [
  "pandas",
  "numpy",
  "scipy",
  "matplotlib",
  "jupyter",
]
dev = [
  "pytest",
  "ruff",
]

[project.urls]
Repository = "https://github.com/eobi/reasonchain-core"

[tool.setuptools.packages.find]
where = ["src"]
